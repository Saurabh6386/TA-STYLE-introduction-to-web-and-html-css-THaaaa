<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>The Box model, box sizing & box shadow</h1>
    </header>
    <hr>

    <h2>Exercise1</h2>

    <section class="box1-parent2">
        <div class="box1-parent1">
            <div class="box box1"></div>
        </div>
    </section>

    <div>
        <span class="circle c1"></span>
        <span>Content</span>
        <span class="circle c2"></span>
        <span>Padding</span>
        <span class="circle c3"></span>
        <span>Border</span>
        <span class="circle c4"></span>
        <span>Margin</span>

    </div>
    <hr>
    <section>
        <div>
            <h2>Exercise 2</h2>
            <p>No border on these boxes</p>
        </div>
        <div class="bigbox">
            <div class="smallboxes"></div>
            <div class="smallboxes"></div>
            <div class="smallboxes"></div>
        </div>

        <hr>

        <div>
            <p>1 px border on these boxes</p>
        </div>

        <div class="bigbox2">
            <div class="smallboxes2 b1"></div>
            <div class="smallboxes2 b2"></div>
            <div class="smallboxes2 b3"></div>
        </div>

    </section>
    


</body>

</html>
